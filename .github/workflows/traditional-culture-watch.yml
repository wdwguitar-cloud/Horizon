name: Traditional Culture Watch

on:
  schedule:
    # GitHub Actions uses UTC. 00:15 UTC = 08:15 Asia/Shanghai.
    - cron: '15 0 * * *'
  workflow_dispatch:

jobs:
  traditional-culture-watch:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.26'

      - name: Install dependencies
        run: uv sync

      - name: Run traditional culture watch
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: uv run python scripts/traditional_culture_watch.py
